const ORDER = ['nature', 'menthe', 'gnamakou'];

// Lighter scene on phones: fewer floating models
if (isSmall) {
    document.querySelectorAll('.b2, .b8, .b9, .l1, .l3').forEach(el => el.remove());
}
const allBerries = document.querySelectorAll('.berry');

let isSwitching = false;
let switchSpin = 0;
let currentFlavor = 'nature';

function modelFor(flavor, i) {
    const list = FLAVORS[flavor].models;
    return 'assets/' + list[i % list.length] + '.glb';
}

// Liquid + foam colours live on two named materials of the bottle
function applyLiquid(flavor) {
    if (!modelViewer.model) return;
    const f = FLAVORS[flavor];
    modelViewer.model.materials.forEach(material => {
        const name = material.name.split('.')[0];
        if (name === 'Liquide') material.pbrMetallicRoughness.setBaseColorFactor(f.liquid);
        if (name === 'Mousse') material.pbrMetallicRoughness.setBaseColorFactor(f.foam);
    });
}

modelViewer.addEventListener('load', () => applyLiquid(currentFlavor));

function updateOrder() {
    const f = FLAVORS[currentFlavor];
    const fmt = FORMATS[currentFormat];
    const text = `Bonjour Coco.P Infusion, je voudrais commander : ${f.name}, ${fmt.size} (${fmt.price} dh). Livraison à Tanger.`;
    document.getElementById('order-link').href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`;
    document.getElementById('order-summary').textContent = `${f.name} · ${fmt.size} · ${fmt.price} dh`;
    document.getElementById('flavor-line').textContent = f.name;
}

function setActive(flavor) {
    cards.forEach(c => c.classList.toggle('active', c.dataset.flavor === flavor));
    navItems.forEach(n => n.classList.toggle('active', n.dataset.flavor === flavor));
}

function requestFlavor(flavor) {
    if (isSwitching || flavor === currentFlavor) return;
    setActive(flavor);
    switchFlavor(flavor);
}

cards.forEach(card => card.addEventListener('click', () => requestFlavor(card.dataset.flavor)));
navItems.forEach(item => item.addEventListener('click', () => requestFlavor(item.dataset.flavor)));
document.getElementById('prev-flavor').addEventListener('click', () => {
    requestFlavor(ORDER[(ORDER.indexOf(currentFlavor) + ORDER.length - 1) % ORDER.length]);
});
document.getElementById('next-flavor').addEventListener('click', () => {
    requestFlavor(ORDER[(ORDER.indexOf(currentFlavor) + 1) % ORDER.length]);
});

formatBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const next = Number(btn.dataset.format);
        if (isSwitching || next === currentFormat) return;
        currentFormat = next;
        formatBtns.forEach(b => b.classList.toggle('active', b === btn));
        updateOrder();
        switchFormat(next);
    });
});

// Bottle spin: 360 with blur, onPeak at full blur, then settle with a back ease
function spinBottle(onPeak, onDone) {
    const spinObj = { val: 0, blur: 0 };
    const apply = () => {
        switchSpin = spinObj.val;
        modelViewer.style.filter = `blur(${spinObj.blur}px)`;
    };
    gsap.to(spinObj, {
        val: 360,
        blur: reducedMotion ? 0 : 15,
        duration: 0.6,
        ease: "power2.in",
        onUpdate: apply,
        onComplete: () => {
            if (onPeak) onPeak();
            gsap.to(spinObj, {
                val: 720,
                blur: 0,
                duration: 1.5,
                ease: "back.out(0.7)",
                onUpdate: apply,
                onComplete: () => {
                    switchSpin = 0;
                    modelViewer.style.filter = 'none';
                    if (onDone) onDone();
                }
            });
        }
    });
}

// Format change: same spin, the bottle model is swapped at the peak
function switchFormat(index) {
    isSwitching = true;
    const fmt = FORMATS[index];
    const radiusObj = { val: currentRadius };
    spinBottle(() => {
        modelViewer.src = fmt.model; // the 'load' listener recolours the juice
        gsap.to(radiusObj, {
            val: fmt.radius, duration: 1.2, ease: 'power2.out',
            onUpdate: () => { currentRadius = radiusObj.val; }
        });
    }, () => { isSwitching = false; });
}

function switchFlavor(flavor) {
    if (isSwitching) return;
    isSwitching = true;
    currentFlavor = flavor;
    updateOrder();
    const body = document.body;
    const berries = document.querySelectorAll('.berry');
    const heroCenter = document.querySelector('.hero-center');
    const f = FLAVORS[flavor];

    // 1. Background Animation
    gsap.to(body, {
        '--bg-inner': f.colors.inner,
        '--bg-mid': f.colors.mid,
        '--bg-outer': f.colors.outer,
        duration: 1.5,
        ease: 'power2.inOut'
    });
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    if (themeMeta) themeMeta.setAttribute('content', f.theme);

    // Side title cross-fade
    gsap.to('#side-title', {
        opacity: 0, y: 20, duration: 0.45, ease: 'power2.in',
        onComplete: () => {
            document.getElementById('side-1').textContent = f.title[0];
            document.getElementById('side-2').textContent = f.title[1];
            gsap.to('#side-title', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' });
        }
    });

    // 2. Bottle Spin Animation (colour swap at the peak)
    spinBottle(() => applyLiquid(flavor));

    // 3. Floating elements "Hide & Reveal" with Dynamic Positioning
    let completedBerries = 0;
    const spread = isSmall ? 70 : 200;
    berries.forEach((berry, i) => {
        const bW = berry.offsetWidth / 2;
        const bH = berry.offsetHeight / 2;
        const centerX = (window.innerWidth / 2 - berry.offsetLeft - bW);
        const centerY = (window.innerHeight / 2 - berry.offsetTop - bH);

        const startAngle = parseFloat(berry.dataset.angle) || 0;
        const currentBaseX = parseFloat(berry.dataset.baseX) || 0;
        const currentBaseY = parseFloat(berry.dataset.baseY) || 0;

        // New random target position
        const nextBaseX = (Math.random() - 0.5) * spread;
        const nextBaseY = (Math.random() - 0.5) * spread;

        gsap.set(berry, {
            rotation: startAngle,
            x: currentBaseX,
            y: currentBaseY
        });

        const berryTl = gsap.timeline();

        berryTl.to(berry, {
            x: centerX,
            y: centerY,
            rotation: startAngle + 45,
            scale: 0.1,
            opacity: 0,
            duration: 0.5,
            ease: "power2.in",
            onComplete: () => {
                berry.src = modelFor(flavor, i);
                heroCenter.style.zIndex = 50;
            }
        })
        .to(berry, {
            duration: 0.3
        })
        .to(berry, {
            onStart: () => {
                heroCenter.style.zIndex = 1;
            },
            x: nextBaseX,
            y: nextBaseY,
            rotation: startAngle + 90,
            scale: 1,
            opacity: 1,
            duration: 0.9,
            ease: "back.out(1.5)",
            clearProps: 'opacity',
            onComplete: () => {
                berry.dataset.angle = startAngle + 90;
                berry.dataset.baseX = nextBaseX;
                berry.dataset.baseY = nextBaseY;
                berry.dataset.rx = 0;
                berry.dataset.ry = 0;

                completedBerries++;
                if (completedBerries === berries.length) {
                    isSwitching = false;
                }
            }
        });
    });
}

// Track floating element states for smoothing
allBerries.forEach(b => {
    b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
    b.dataset.baseX = 0; b.dataset.baseY = 0;
    b.dataset.targetRx = 0; b.dataset.targetRy = 0;
});

let mouse = { x: 0, y: 0, px: -9999, py: -9999 };
let currentMouse = { x: 0, y: 0 };

// Real mouse only: a tap on a phone also fires a fake mouse move, which must not
// be mistaken for a cursor (it used to freeze the tilt after the first tap)
window.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    mouse.x = (e.clientX / window.innerWidth) - 0.5;
    mouse.y = (e.clientY / window.innerHeight) - 0.5;
    mouse.px = e.clientX;
    mouse.py = e.clientY;
});

// Touch: the finger plays the role of the cursor
function onTouch(e) {
    const t = e.touches[0];
    if (!t) return;
    mouse.x = (t.clientX / window.innerWidth) - 0.5;
    mouse.y = (t.clientY / window.innerHeight) - 0.5;
    mouse.px = t.clientX;
    mouse.py = t.clientY;
}
window.addEventListener('touchstart', onTouch, { passive: true });
window.addEventListener('touchmove', onTouch, { passive: true });
window.addEventListener('touchend', () => { mouse.px = -9999; mouse.py = -9999; mouse.x = 0; mouse.y = 0; }, { passive: true });

// Tilting the phone tilts the bottle and slides the floating elements
let motionActive = false;
let fingerDown = false;
window.addEventListener('touchstart', () => { fingerDown = true; }, { passive: true });
window.addEventListener('touchend', () => { fingerDown = false; }, { passive: true });
window.addEventListener('touchcancel', () => { fingerDown = false; }, { passive: true });

function onTilt(e) {
    if (e.gamma === null || e.beta === null) return;
    if (fingerDown) return; // a finger is down: it wins
    mouse.x = Math.max(-0.5, Math.min(0.5, e.gamma / 40));
    mouse.y = Math.max(-0.5, Math.min(0.5, (e.beta - 45) / 50));
}

// Shaking the phone scatters the floating elements, wobbles the bottle and releases bubbles
let lastAccel = null;
let lastShake = 0;
function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x === null) return;
    if (lastAccel) {
        const delta = Math.abs(a.x - lastAccel.x) + Math.abs(a.y - lastAccel.y) + Math.abs(a.z - lastAccel.z);
        if (delta > 22 && Date.now() - lastShake > 900) {
            lastShake = Date.now();
            shake();
        }
    }
    lastAccel = { x: a.x, y: a.y, z: a.z };
}
function shake() {
    if (isSwitching) return;
    document.querySelectorAll('.berry').forEach(berry => {
        berry.dataset.rx = (Math.random() - 0.5) * 240;
        berry.dataset.ry = (Math.random() - 0.5) * 240;
    });
    const wob = { t: 0 };
    gsap.to(wob, {
        t: 1, duration: 1.1, ease: 'none',
        onUpdate: () => { if (!isSwitching) switchSpin = Math.sin(wob.t * Math.PI * 5) * 28 * (1 - wob.t); },
        onComplete: () => { if (!isSwitching) switchSpin = 0; }
    });
    for (let i = 0; i < 14; i++) setTimeout(createBubble, i * 40);
}

function startMotion() {
    if (motionActive) return;
    motionActive = true;
    window.addEventListener('deviceorientation', onTilt);
    window.addEventListener('devicemotion', onMotion);
}
// iOS only hands out motion data after a tap and a system prompt; Android gives it straight away
function enableMotion(onFail) {
    const O = window.DeviceOrientationEvent, M = window.DeviceMotionEvent;
    const asks = [];
    if (O && typeof O.requestPermission === 'function') asks.push(O.requestPermission());
    if (M && typeof M.requestPermission === 'function') asks.push(M.requestPermission());
    if (!asks.length) { startMotion(); return; }
    Promise.all(asks).then(states => { if (states.includes('granted')) startMotion(); }).catch(() => { if (onFail) onFail(); });
}
const hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (hasTouch && !reducedMotion && window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        // asked on the first tap; if iOS refuses that tap as a gesture, the next tap asks again
        const ask = () => {
            window.removeEventListener('click', ask);
            enableMotion(() => window.addEventListener('click', ask));
        };
        window.addEventListener('click', ask);
    } else {
        enableMotion();
    }
}

function animate() {
    const time = Date.now() * 0.001;
    // Smoothly interpolate current mouse to target mouse
    currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
    currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

    // Tilt the bottle + add switch spin
    modelViewer.cameraOrbit = `${(currentMouse.x * 40) + switchSpin}deg ${90 + (currentMouse.y * 20)}deg ${currentRadius}%`;

    // Update parallax containers - Always
    const par = isSmall ? 0.4 : 1;
    berriesFG.style.transform = `translate(${currentMouse.x * 60 * par}px, ${currentMouse.y * 60 * par}px)`;
    berriesBG.style.transform = `translate(${currentMouse.x * -30 * par}px, ${currentMouse.y * -30 * par}px)`;
    leavesBG.style.transform = `translate(${currentMouse.x * -15 * par}px, ${currentMouse.y * -15 * par}px)`;

    // Update each floating element with its own smoothing and float - ONLY IF NOT SWITCHING
    if (!isSwitching) {
        const radius = isSmall ? 220 : 400;
        const strength = isSmall ? -45 : -80;
        allBerries.forEach((berry, i) => {
            const berryRect = berry.getBoundingClientRect();
            const berryX = berryRect.left + berryRect.width / 2;
            const berryY = berryRect.top + berryRect.height / 2;

            const diffX = mouse.px - berryX;
            const diffY = mouse.py - berryY;
            const distance = Math.sqrt(diffX * diffX + diffY * diffY);

            let targetRx = 0, targetRy = 0, speedMult = 1;

            if (distance < radius && distance > 0.001) {
                const force = (radius - distance) / radius;
                targetRx = (diffX / distance) * force * strength;
                targetRy = (diffY / distance) * force * strength;
                speedMult = 1 + force * 5;
            }

            // Lerp repulsion values
            let rx = parseFloat(berry.dataset.rx) || 0;
            let ry = parseFloat(berry.dataset.ry) || 0;
            let angle = parseFloat(berry.dataset.angle) || 0;
            let baseX = parseFloat(berry.dataset.baseX) || 0;
            let baseY = parseFloat(berry.dataset.baseY) || 0;

            rx += (targetRx - rx) * 0.1;
            ry += (targetRy - ry) * 0.1;
            angle += 0.2 * speedMult;

            berry.dataset.rx = rx;
            berry.dataset.ry = ry;
            berry.dataset.angle = angle;

            // Floating effect
            const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
            const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
            const floatY = Math.sin(phase) * 15;
            const floatAngle = Math.cos(phase) * 6;

            berry.style.transform = `translate(calc(${rx + baseX}px), calc(${ry + baseY}px + ${floatY}px)) rotate(calc(${angle}deg + ${floatAngle}deg))`;
        });
    }

    // Update leaves with float - ALWAYS
    document.querySelectorAll('.leaf').forEach((leaf, i) => {
        const dur = 10 + i * 2;
        const phase = (time + i * 1.2) * (Math.PI * 2 / dur);
        const floatY = Math.sin(phase) * 20;
        const floatX = Math.cos(phase * 0.5) * 15;
        const floatAngle = Math.sin(phase * 0.3) * 15;
        leaf.style.transform = `translate(${floatX}px, ${floatY}px) rotate(${floatAngle}deg)`;
    });

    requestAnimationFrame(animate);
}

updateOrder();
animate();

// Bubbles Generator
const bubblesContainer = document.getElementById('bubbles-container');
function createBubble() {
    if (!bubblesContainer || document.hidden) return;
    const bubble = document.createElement('div');
    bubble.className = 'bubble-img';
    const size = Math.random() * 20 + 10 + 'px';
    bubble.style.width = size;
    bubble.style.height = size;
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.bottom = '-50px';
    bubble.style.opacity = Math.random() * 0.4 + 0.2;

    const duration = Math.random() * 6 + 4;
    bubble.style.animation = `floatUpImg ${duration}s linear forwards`;

    bubblesContainer.appendChild(bubble);
    setTimeout(() => bubble.remove(), duration * 1000);
}
if (!reducedMotion) setInterval(createBubble, isSmall ? 700 : 400);
</script>
</body>
</html>
